[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwee"
version = "13.0.0"
description = "Hello World Enterprise Edition: mission-critical greeting delivery platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # Not-Invented-Here policy, see ADR-0001

[project.scripts]
hwee = "hwee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwee = ["hwee.conf", "resources/*", "resources/fonts/*"]
