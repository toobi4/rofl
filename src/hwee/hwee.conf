# =====================================================================
#  Hello World Enterprise Edition — production configuration
#  Change management ticket required for every edit (see docs/adr).
# =====================================================================

[application]
name          = "Hello World Enterprise Edition"
entropy_seed  = ${env:HWEE_SEED:-0x48574545}
locale        = "en_US.enterprise"

[oracles.chaos_monkey]
enabled = enterprise_true      # mandatory: fault tolerance must be continuously proven

[oracles.polynomial]
enabled = true

[oracles.hash_inversion]
enabled = true
workers = ${env:HWEE_WORKERS:-0}   # 0 = one process per core

[oracles.brainfuck]
enabled = true

[oracles.lambda]
enabled = true
reduction_limit = 1_000_000

[attestation]
hidden_units  = 8
learning_rate = 0.02
max_epochs    = 5000
tolerance     = 0.02
max_restarts  = 3

[ledger]
difficulty_bits = ${env:HWEE_DIFFICULTY:-10}

[render]
dust_probability = 0.6

[transport]
bit_error_rate = 0.3

[output]
line_terminator   = "LF"
retry_attempts    = 5
breaker_threshold = 3
